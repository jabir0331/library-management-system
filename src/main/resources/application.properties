# Basic
spring.application.name=library-management

# Optionally load local settings from a git-ignored .env file (real environment variables still win)
spring.config.import=optional:file:./.env[.properties]

# PostgreSQL Database Configuration
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/library_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true

# Logging
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Server Configuration
server.port=8080

# DevTools
spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=true

# Security / JWT (set JWT_SECRET env var to a random string of 32+ chars)
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

# First-admin bootstrap (only used when the admin table is empty)
app.bootstrap-admin.username=${BOOTSTRAP_ADMIN_USERNAME:admin}
app.bootstrap-admin.email=${BOOTSTRAP_ADMIN_EMAIL:admin@library.local}
app.bootstrap-admin.password=${BOOTSTRAP_ADMIN_PASSWORD:}

# Pagination: requested page sizes are capped at this value
spring.data.web.pageable.max-page-size=100
